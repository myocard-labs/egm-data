# ---------------------------------------------------------------------------
# pyproject.toml — myocard-egm-data
#
# Pure I/O layer for the intracardiac-EGM stack. Readers and writers for every
# on-disk format defined by myocard-egm-contracts (HDF5 banks, run.json,
# metrics.csv, predictions, model_metadata, and the cross-artifact-linkage
# phase JSON formats). No torch, no model code — the training-data layer
# (datasets / splits / augmentation) lives in its sole consumer,
# myocard-egm-classifier.
#
# Convention recap:
#   GitHub repo  : egm-data                  (bare)
#   PyPI dist    : myocard-egm-data          (myocard- prefix)
#   Import name  : myocard_egm_data          (underscore)
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myocard-egm-data"
version = "0.5.0"
description = "Pure I/O for myocard-egm-contracts formats: HDF5 banks, run records, predictions, and phase-manifest JSON."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Daniel Klein", email = "daniel.anthony.klein.88@gmail.com" },
]
keywords = ["cardiac", "electrophysiology", "signal-processing", "egm", "hdf5", "dataset"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Runtime deps are deliberately lean: numpy + h5py for HDF5 I/O, and the
# contracts package (the format truth). No torch — this is a pure I/O layer;
# the torch-based training-data layer lives in myocard-egm-classifier.
dependencies = [
  "myocard-egm-contracts @ git+https://github.com/myocard-labs/egm-contracts.git@v0.6.0",
  # numpy 2.5+ ships type stubs that use PEP 695 "type X = Y" alias
  # syntax, which mypy refuses to parse under ``python_version = "3.10"``
  # (the version we type-check against to keep 3.10 runtime support).
  # Cap below 2.5 until either mypy accepts the syntax under 3.10 or we
  # bump the type-check target to 3.12.
  "numpy>=1.26,<2.5",
  "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # ruff and mypy are pinned to exact versions (matching egm-contracts)
  # so local dev, CI, and the pre-commit hook all run the same binary
  # and format/typecheck identically. Bumping ruff or mypy means
  # updating this line, .pre-commit-config.yaml, and ci.yml together.
  "ruff==0.15.17",
  "mypy==2.1.0",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
]

[project.urls]
Homepage      = "https://github.com/myocard-labs/egm-data"
Repository    = "https://github.com/myocard-labs/egm-data"
Issues        = "https://github.com/myocard-labs/egm-data/issues"
Organization  = "https://github.com/myocard-labs"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

# Hatchling refuses direct URL references in dependencies by default; we
# need it during pre-1.0 iteration so we can pin myocard-egm-contracts to
# a git tag. Drop this once everything ships on (Test)PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myocard_egm_data"]
# Ship py.typed so downstream consumers (and CI mypy) can type-check
# imports from this package without an ignore-missing-imports override.
artifacts = [
  "src/myocard_egm_data/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"__init__.py"   = ["F401"]

# Pin the isort grouping explicitly so local + CI agree. Without this,
# ruff's auto-detection can put `myocard_egm_contracts` and
# `myocard_egm_data` in the same group locally but different groups in
# CI (where both are installed editable). Lock the convention here.
[tool.ruff.lint.isort]
known-first-party = ["myocard_egm_data"]
known-third-party = ["myocard_egm_contracts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
]

[tool.coverage.run]
source = ["src/myocard_egm_data"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

# h5py ships without complete inline stubs; ignore-missing-imports silences
# the dance without sacrificing strict checking everywhere else.
# myocard-egm-contracts now ships py.typed, so it can be type-checked
# normally and is NOT in this override list.
[[tool.mypy.overrides]]
module = [
  "h5py.*",
]
ignore_missing_imports = true
